name: Validate source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Every commit being pushed is checked, not only the newest: a detail added and removed again
      # would otherwise stay in the history.
      - name: Check for private backup details
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $range = if ($env:BASE) { "$env:BASE..HEAD" } elseif ($env:BEFORE -and $env:BEFORE -notmatch '^0+$') { "$env:BEFORE..HEAD" } else { "origin/${{ github.event.repository.default_branch }}..HEAD" }
          ./Test-PrivacyGuard.ps1 -Range $range
      - name: Verify the privacy check itself
        shell: pwsh
        run: ./Test-PrivacyGuardRules.ps1
      - name: Parse all PowerShell sources
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
            # A stray control character (an escape mangled by an editing tool) parses fine but breaks paths.
            if ([IO.File]::ReadAllText($_.FullName) -match '[\x00-\x08\x0B\x0C\x0E-\x1F]') { Write-Error "Control character in $($_.Name)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Compile native helpers and report generator
        shell: pwsh
        run: |
          Add-Type -Path ./Backup.Process.cs
          Add-Type -Path ./Backup.MirrorVerifier.cs
          Add-Type -Path ./Backup.Taskbar.cs
          python -m py_compile ./Build-BackupReport.py
      - name: Check example configuration
        shell: pwsh
        run: |
          $config = Get-Content ./config.example.json -Raw | ConvertFrom-Json
          if ($config.MemoryMiB -lt 512 -or $config.Include.Count -eq 0) { throw 'Invalid example' }
      - name: Verify concurrent status access
        shell: pwsh
        run: ./Test-BackupStatus.ps1
      - name: Verify drive check rules
        shell: pwsh
        run: ./Test-BackupDriveCheck.ps1
      - name: Verify the AI session activity rule
        shell: pwsh
        run: ./Test-BackupActivity.ps1
      - name: Verify colour themes and contrast
        shell: pwsh
        run: ./Test-BackupTheme.ps1
      - name: Verify the clean-up of old versions
        shell: pwsh
        run: ./Test-BackupRetention.ps1
      - name: Verify history selection safeguards
        shell: pwsh
        run: ./Test-BackupHistory.ps1
      - name: Verify private credential file safeguards
        shell: pwsh
        run: ./Test-BackupSecuritySafety.ps1
      - name: Verify plain copy rules
        shell: pwsh
        run: ./Test-BackupCopyRules.ps1
      - name: Verify plain copy runs, failures and recovery folders
        shell: pwsh
        run: ./Test-BackupMirror.ps1
      - name: Verify the rules for versions
        shell: pwsh
        run: ./Test-BackupVersionsRules.ps1
      - name: Verify versions against a disposable repository
        shell: pwsh
        run: |
          ./Install-BackupEngine.ps1
          ./Test-BackupVersions.ps1
      - name: Verify the window's data and run results
        shell: pwsh
        run: ./Test-BackupData.ps1
      - name: Verify the window opens on every page
        shell: pwsh
        run: ./Test-BackupWindow.ps1
      - name: Verify drive tools and the report generator
        shell: pwsh
        run: |
          ./Test-BackupTools.ps1
          python ./Test-BackupToolsReport.py
      - name: Verify the hard memory limit
        shell: pwsh
        run: ./Test-BackupResourceControls.ps1
